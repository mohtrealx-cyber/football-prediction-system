name: Run Football Prediction System

on:
  schedule:
    - cron: '0 6 * * *' # Runs daily at 06:00 UTC (adjust as needed)
  workflow_dispatch: # Allows manual runs from the Actions tab

jobs:
  run-system:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run prediction pipeline
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          # Keep any other existing API keys your workflow needs here:
          SCRAMBLE_API_KEY: ${{ secrets.SCRAMBLE_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python main.py
